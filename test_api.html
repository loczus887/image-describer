<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>
    <h1>Image Describer API Test</h1>
    
    <div class="test-section">
        <h2>1. Test Health Endpoint</h2>
        <button onclick="testHealth()">Test /health</button>
        <div id="health-result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Test Describe Endpoint</h2>
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="testDescribe()">Test /describe</button>
        <div id="describe-result"></div>
    </div>
    
    <div class="test-section">
        <h2>3. Test History Endpoint</h2>
        <button onclick="testHistory()">Test /history</button>
        <div id="history-result"></div>
    </div>
    
    <div id="result"></div>

    <script>
        const API_URL = 'http://localhost:8000';
        
        async function testHealth() {
            const resultDiv = document.getElementById('health-result');
            resultDiv.innerHTML = 'Testing...';
            
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                resultDiv.innerHTML = `<span class="success">✓ Success:</span><br>${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ Error:</span><br>${error.message}`;
            }
        }
        
        async function testDescribe() {
            const fileInput = document.getElementById('imageInput');
            const resultDiv = document.getElementById('describe-result');
            
            if (!fileInput.files || !fileInput.files[0]) {
                resultDiv.innerHTML = '<span class="error">Please select an image first</span>';
                return;
            }
            
            resultDiv.innerHTML = 'Uploading and processing...<br><small>This may take several minutes on first run (model needs to download ~990MB)</small>';
            
            try {
                const formData = new FormData();
                formData.append('file', fileInput.files[0]);
                
                console.log('Sending request to:', `${API_URL}/describe`);
                console.log('File:', fileInput.files[0].name, fileInput.files[0].size, 'bytes');
                
                // Create AbortController for timeout
                const controller = new AbortController();
                const timeoutId = setTimeout(() => {
                    controller.abort();
                    resultDiv.innerHTML = '<span class="error">✗ Timeout: Request took too long. Check backend logs.</span>';
                }, 300000); // 5 minutes
                
                const response = await fetch(`${API_URL}/describe`, {
                    method: 'POST',
                    body: formData,
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (data.success) {
                    resultDiv.innerHTML = `<span class="success">✓ Success!</span><br><strong>Description:</strong><br>${data.description}`;
                } else {
                    resultDiv.innerHTML = `<span class="error">✗ Failed:</span><br>${data.error || 'Unknown error'}`;
                }
            } catch (error) {
                console.error('Error:', error);
                if (error.name === 'AbortError') {
                    resultDiv.innerHTML = '<span class="error">✗ Timeout: Request took too long. The model may still be loading. Check backend terminal for progress.</span>';
                } else {
                    resultDiv.innerHTML = `<span class="error">✗ Error:</span><br>${error.message}`;
                }
            }
        }
        
        async function testHistory() {
            const resultDiv = document.getElementById('history-result');
            resultDiv.innerHTML = 'Loading...';
            
            try {
                const response = await fetch(`${API_URL}/history?limit=5`);
                const data = await response.json();
                resultDiv.innerHTML = `<span class="success">✓ Success:</span><br>${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">✗ Error:</span><br>${error.message}`;
            }
        }
    </script>
</body>
</html>
